name: Issue 773 Metal Hybrid Bundle Probe

on:
  workflow_dispatch:
  push:
    branches:
      - issue773-repro
    paths:
      - ".github/workflows/issue773-hybrid-metal.yml"

jobs:
  hybrid-metal-probe:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      # ============================================================
      # 1. Checkout reporter's engine version
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout reporter engine commit
        run: |
          git fetch https://github.com/cactus-compute/cactus.git \
            1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          git checkout 1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          echo "===== CACTUS COMMIT ====="
          git rev-parse HEAD
          git log -1 --oneline

      # ============================================================
      # 2. Machine / Metal
      # ============================================================

      - name: Show machine info
        run: |
          echo "===== MACHINE ====="
          uname -a
          uname -m
          sw_vers

          echo
          echo "===== HARDWARE ====="
          system_profiler SPHardwareDataType

          echo
          echo "===== GPU ====="
          system_profiler SPDisplaysDataType || true

          echo
          echo "===== DISK ====="
          df -h

      - name: Verify Metal device
        run: |
          cat > /tmp/metal_probe.swift <<'SWIFT'
          import Foundation
          import Metal

          if let device = MTLCreateSystemDefaultDevice() {
              print("METAL_AVAILABLE=YES")
              print("METAL_DEVICE=\(device.name)")
          } else {
              print("METAL_AVAILABLE=NO")
              exit(1)
          }
          SWIFT

          swift /tmp/metal_probe.swift

      # ============================================================
      # 3. Build Cactus
      # ============================================================

      - name: Install dependencies
        run: |
          brew install python@3.12 cmake

      - name: Setup and build Cactus
        shell: bash
        run: |
          source ./setup
          cactus build --python

          echo
          echo "===== CACTUS LIBRARY ====="
          file cactus-engine/build/libcactus_engine.dylib
          ls -lh cactus-engine/build/libcactus_engine.dylib

      - name: Verify Cactus Metal backend
        shell: bash
        run: |
          source venv/bin/activate

          python - <<'PY'
          from cactus.bindings import cactus as C

          rc = C.cactus_set_backend("metal")

          print("cactus_set_backend('metal') =", rc)

          if rc != 0:
              raise SystemExit("Cactus rejected Metal backend")

          print("CACTUS_METAL_BACKEND=AVAILABLE")
          PY

      # ============================================================
      # 4. Tooling + canonical GSM8K harness
      # ============================================================

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          source venv/bin/activate
          python -m pip install -U huggingface_hub

      - name: Fetch pinned GSM8K harness
        run: |
          git clone \
            https://github.com/john-rocky/apple-silicon-llm-bench.git \
            "$RUNNER_TEMP/llm-bench"

          cd "$RUNNER_TEMP/llm-bench"

          git checkout fab4074629bd87116c405e5073f91bc3524b5eff

          echo "===== HARNESS COMMIT ====="
          git rev-parse HEAD

          mkdir -p "$RUNNER_TEMP/gsm8k_reports"

      # ============================================================
      # 5. Hybrid bundle helper
      #
      # Commands:
      #
      #   extract:
      #     extract base bundle without its ZIP root directory
      #
      #   overlay:
      #     verify donor .weights layout matches base,
      #     then replace all .weights with donor versions
      # ============================================================

      - name: Write hybrid bundle helper
        run: |
          cat > /tmp/make_hybrid.py <<'PY'
          import argparse
          import shutil
          import zipfile

          from pathlib import Path, PurePosixPath


          COPY_CHUNK = 8 * 1024 * 1024


          def relative_path(name):
              parts = PurePosixPath(name).parts

              # ZIP contains one top-level bundle directory.
              if len(parts) < 2:
                  return None

              rel = PurePosixPath(*parts[1:])

              if ".." in rel.parts:
                  raise RuntimeError(
                      f"Unsafe ZIP path: {name}"
                  )

              return rel


          def zip_weight_inventory(zip_path):
              inventory = {}

              with zipfile.ZipFile(zip_path) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue

                      rel = relative_path(info.filename)

                      if rel is None:
                          continue

                      rel_string = str(rel)

                      if rel_string.endswith(".weights"):
                          inventory[rel_string] = info.file_size

              return inventory


          def directory_weight_inventory(directory):
              directory = Path(directory)

              inventory = {}

              for path in directory.rglob("*.weights"):
                  rel = str(path.relative_to(directory))

                  inventory[rel] = path.stat().st_size

              return inventory


          def extract_bundle(zip_path, output):
              output = Path(output)

              if output.exists():
                  shutil.rmtree(output)

              output.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              count = 0

              with zipfile.ZipFile(zip_path) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue

                      rel = relative_path(info.filename)

                      if rel is None:
                          continue

                      target = output / Path(*rel.parts)

                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                      with zf.open(info) as src:
                          with target.open("wb") as dst:
                              shutil.copyfileobj(
                                  src,
                                  dst,
                                  length=COPY_CHUNK,
                              )

                      count += 1

              print(
                  f"EXTRACTED_FILES={count}"
              )

              print(
                  f"BUNDLE_READY={output}"
              )


          def verify_weight_layout(donor_zip, base_directory):
              donor = zip_weight_inventory(donor_zip)

              base = directory_weight_inventory(
                  base_directory
              )

              print(
                  f"BASE_WEIGHT_FILES={len(base)}"
              )

              print(
                  f"DONOR_WEIGHT_FILES={len(donor)}"
              )

              only_base = sorted(
                  set(base) - set(donor)
              )

              only_donor = sorted(
                  set(donor) - set(base)
              )

              size_mismatch = sorted(
                  path
                  for path in set(base) & set(donor)
                  if base[path] != donor[path]
              )

              if only_base:
                  print("===== WEIGHTS ONLY IN BASE =====")

                  for path in only_base[:20]:
                      print(path)

              if only_donor:
                  print("===== WEIGHTS ONLY IN DONOR =====")

                  for path in only_donor[:20]:
                      print(path)

              if size_mismatch:
                  print("===== WEIGHT SIZE MISMATCHES =====")

                  for path in size_mismatch[:20]:
                      print(
                          f"{path}: "
                          f"base={base[path]} "
                          f"donor={donor[path]}"
                      )

              if (
                  only_base
                  or only_donor
                  or size_mismatch
              ):
                  raise RuntimeError(
                      "Weight layouts are not interchangeable"
                  )

              print(
                  "WEIGHT_LAYOUT_COMPATIBLE=YES"
              )


          def overlay_weights(donor_zip, output):
              verify_weight_layout(
                  donor_zip,
                  output,
              )

              output = Path(output)

              count = 0

              with zipfile.ZipFile(donor_zip) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue

                      rel = relative_path(info.filename)

                      if rel is None:
                          continue

                      rel_string = str(rel)

                      if not rel_string.endswith(
                          ".weights"
                      ):
                          continue

                      target = (
                          output
                          / Path(*rel.parts)
                      )

                      if not target.exists():
                          raise RuntimeError(
                              f"Missing base weight: {rel}"
                          )

                      if (
                          target.stat().st_size
                          != info.file_size
                      ):
                          raise RuntimeError(
                              f"Size mismatch: {rel}"
                          )

                      with zf.open(info) as src:
                          with target.open("wb") as dst:
                              shutil.copyfileobj(
                                  src,
                                  dst,
                                  length=COPY_CHUNK,
                              )

                      count += 1

              print(
                  f"OVERLAID_WEIGHT_FILES={count}"
              )


          def main():
              parser = argparse.ArgumentParser()

              commands = parser.add_subparsers(
                  dest="command",
                  required=True,
              )

              extract = commands.add_parser(
                  "extract"
              )

              extract.add_argument(
                  "--zip",
                  required=True,
              )

              extract.add_argument(
                  "--output",
                  required=True,
              )

              overlay = commands.add_parser(
                  "overlay"
              )

              overlay.add_argument(
                  "--donor",
                  required=True,
              )

              overlay.add_argument(
                  "--output",
                  required=True,
              )

              args = parser.parse_args()

              if args.command == "extract":
                  extract_bundle(
                      args.zip,
                      args.output,
                  )

              elif args.command == "overlay":
                  overlay_weights(
                      args.donor,
                      args.output,
                  )


          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # 6. HYBRID A
      #
      # BAD shell / graphs / config
      # GOOD weights
      #
      # Question:
      # Does replacing BAD weights with GOOD weights fix Q1?
      # ============================================================

      - name: Download BAD base for Hybrid A
        shell: bash
        run: |
          source venv/bin/activate

          mkdir -p "$RUNNER_TEMP/issue773"

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify BAD base hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7a2579ad1089f626b15e121a1fa6a0d8294a4e7f1f7af38823620b5b5a8b8eec  gemma-4-e2b-it-cq4.zip" \
          | shasum -a 256 -c -

      - name: Extract BAD shell for Hybrid A
        run: |
          python /tmp/make_hybrid.py extract \
            --zip "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip" \
            --output "$RUNNER_TEMP/hybrid_bad_shell_good_weights"

          rm -f \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip"

          echo
          echo "===== DISK AFTER BAD EXTRACTION ====="
          df -h

      - name: Download GOOD weights for Hybrid A
        shell: bash
        run: |
          source venv/bin/activate

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4-uncalibrated.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify GOOD donor hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7c71f075554bd27bd443f75ff2012b95be30f0254f7d864642ee89d3b706d980  gemma-4-e2b-it-cq4-uncalibrated.zip" \
          | shasum -a 256 -c -

      - name: Overlay GOOD weights onto BAD shell
        run: |
          python /tmp/make_hybrid.py overlay \
            --donor "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip" \
            --output "$RUNNER_TEMP/hybrid_bad_shell_good_weights"

          rm -f \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip"

          echo
          echo "===== DISK BEFORE HYBRID A RUN ====="
          df -h

      - name: Run Hybrid A GSM8K Q1 on Metal
        shell: bash
        run: |
          set -o pipefail
          source venv/bin/activate

          GSM8K_REPORTS="$RUNNER_TEMP/gsm8k_reports" \
          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/hybrid_bad_shell_good_weights" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend metal \
            --n 1 \
            --max-tokens 1024 \
            --tag hybrid-bad-shell-good-weights \
            | tee hybrid_a.txt

      - name: Remove Hybrid A
        run: |
          rm -rf \
            "$RUNNER_TEMP/hybrid_bad_shell_good_weights"

          echo
          echo "===== DISK AFTER HYBRID A ====="
          df -h

      # ============================================================
      # 7. HYBRID B
      #
      # GOOD shell / graphs / config
      # BAD weights
      #
      # Question:
      # Do BAD weights make the GOOD shell fail?
      # ============================================================

      - name: Download GOOD base for Hybrid B
        shell: bash
        run: |
          source venv/bin/activate

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4-uncalibrated.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify GOOD base hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7c71f075554bd27bd443f75ff2012b95be30f0254f7d864642ee89d3b706d980  gemma-4-e2b-it-cq4-uncalibrated.zip" \
          | shasum -a 256 -c -

      - name: Extract GOOD shell for Hybrid B
        run: |
          python /tmp/make_hybrid.py extract \
            --zip "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip" \
            --output "$RUNNER_TEMP/hybrid_good_shell_bad_weights"

          rm -f \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip"

          echo
          echo "===== DISK AFTER GOOD EXTRACTION ====="
          df -h

      - name: Download BAD weights for Hybrid B
        shell: bash
        run: |
          source venv/bin/activate

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify BAD donor hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7a2579ad1089f626b15e121a1fa6a0d8294a4e7f1f7af38823620b5b5a8b8eec  gemma-4-e2b-it-cq4.zip" \
          | shasum -a 256 -c -

      - name: Overlay BAD weights onto GOOD shell
        run: |
          python /tmp/make_hybrid.py overlay \
            --donor "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip" \
            --output "$RUNNER_TEMP/hybrid_good_shell_bad_weights"

          rm -f \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip"

          echo
          echo "===== DISK BEFORE HYBRID B RUN ====="
          df -h

      - name: Run Hybrid B GSM8K Q1 on Metal
        shell: bash
        run: |
          set -o pipefail
          source venv/bin/activate

          GSM8K_REPORTS="$RUNNER_TEMP/gsm8k_reports" \
          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/hybrid_good_shell_bad_weights" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend metal \
            --n 1 \
            --max-tokens 1024 \
            --tag hybrid-good-shell-bad-weights \
            | tee hybrid_b.txt

      # ============================================================
      # 8. Print diagnostic comparison
      # ============================================================

      - name: Print hybrid comparison
        run: |
          echo
          echo "=========================================="
          echo "HYBRID A"
          echo "BAD SHELL + GOOD WEIGHTS"
          echo "=========================================="
          cat hybrid_a.txt

          echo
          echo "=========================================="
          echo "HYBRID B"
          echo "GOOD SHELL + BAD WEIGHTS"
          echo "=========================================="
          cat hybrid_b.txt

          echo
          echo "=========================================="
          echo "RESULT JSON"
          echo "=========================================="

          cat \
            "$RUNNER_TEMP/gsm8k_reports/gsm8k_hybrid-bad-shell-good-weights.json"

          echo

          cat \
            "$RUNNER_TEMP/gsm8k_reports/gsm8k_hybrid-good-shell-bad-weights.json"

      # ============================================================
      # 9. Save results
      # ============================================================

      - name: Collect results
        run: |
          mkdir -p issue773_hybrid_results

          cp hybrid_a.txt \
            issue773_hybrid_results/

          cp hybrid_b.txt \
            issue773_hybrid_results/

          cp "$RUNNER_TEMP/gsm8k_reports/"*.json \
            issue773_hybrid_results/

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: issue773-metal-hybrid-q1
          path: issue773_hybrid_results/
