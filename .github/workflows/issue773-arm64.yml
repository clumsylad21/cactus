name: Issue 773 Metal GSM8K n5 Repro

on:
  workflow_dispatch:
  push:
    branches:
      - issue773-repro

jobs:
  metal-gsm8k-n5:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # ============================================================
      # 1. Checkout reporter's Cactus engine
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout reporter engine commit
        run: |
          git fetch https://github.com/cactus-compute/cactus.git \
            1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          git checkout 1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          echo "===== CACTUS COMMIT ====="
          git rev-parse HEAD
          git log -1 --oneline

      # ============================================================
      # 2. Machine / Metal info
      # ============================================================

      - name: Show machine info
        run: |
          echo "===== ARCH ====="
          uname -a
          uname -m

          echo
          echo "===== MACOS ====="
          sw_vers

          echo
          echo "===== HARDWARE ====="
          system_profiler SPHardwareDataType

          echo
          echo "===== GPU ====="
          system_profiler SPDisplaysDataType || true

          echo
          echo "===== DISK ====="
          df -h

      - name: Verify Metal device
        run: |
          cat > /tmp/metal_probe.swift <<'SWIFT'
          import Foundation
          import Metal

          if let device = MTLCreateSystemDefaultDevice() {
              print("METAL_AVAILABLE=YES")
              print("METAL_DEVICE=\(device.name)")
          } else {
              print("METAL_AVAILABLE=NO")
              exit(1)
          }
          SWIFT

          swift /tmp/metal_probe.swift

      # ============================================================
      # 3. Build Cactus
      # ============================================================

      - name: Install dependencies
        run: |
          brew install python@3.12 cmake

      - name: Setup and build Cactus
        shell: bash
        run: |
          source ./setup
          cactus build --python

          echo
          echo "===== CACTUS LIBRARY ====="
          file cactus-engine/build/libcactus_engine.dylib
          ls -lh cactus-engine/build/libcactus_engine.dylib

      - name: Verify Cactus Metal backend
        shell: bash
        run: |
          source venv/bin/activate

          python - <<'PY'
          from cactus.bindings import cactus as C

          rc = C.cactus_set_backend("metal")
          print("cactus_set_backend('metal') =", rc)

          if rc != 0:
              raise SystemExit("Cactus rejected Metal backend")

          print("CACTUS_METAL_BACKEND=AVAILABLE")
          PY

      # ============================================================
      # 4. Tooling + canonical GSM8K harness
      # ============================================================

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          source venv/bin/activate
          python -m pip install -U huggingface_hub

      - name: Fetch pinned GSM8K harness
        run: |
          git clone \
            https://github.com/john-rocky/apple-silicon-llm-bench.git \
            "$RUNNER_TEMP/llm-bench"

          cd "$RUNNER_TEMP/llm-bench"

          git checkout fab4074629bd87116c405e5073f91bc3524b5eff

          echo "===== HARNESS COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== GSM8K ====="
          ls -lh evaldata/gsm8k_test.jsonl
          ls -lh scripts/parity_gsm8k.py

          mkdir -p "$RUNNER_TEMP/gsm8k_reports"

      # ============================================================
      # 5. GOOD first — previous uncalibrated CQ4
      # ============================================================

      - name: Download GOOD uncalibrated CQ4
        shell: bash
        run: |
          source venv/bin/activate

          mkdir -p "$RUNNER_TEMP/issue773"

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4-uncalibrated.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify GOOD hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7c71f075554bd27bd443f75ff2012b95be30f0254f7d864642ee89d3b706d980  gemma-4-e2b-it-cq4-uncalibrated.zip" \
          | shasum -a 256 -c -

      - name: Extract GOOD CQ4
        run: |
          mkdir -p "$RUNNER_TEMP/good_cq4"

          unzip -q \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip" \
            -d "$RUNNER_TEMP/good_cq4"

          echo "===== GOOD BUNDLE ====="
          find "$RUNNER_TEMP/good_cq4" -name config.txt

          echo
          df -h

      - name: Run GOOD GSM8K n=5 on Metal
        shell: bash
        run: |
          source venv/bin/activate

          GSM8K_REPORTS="$RUNNER_TEMP/gsm8k_reports" \
          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/good_cq4/gemma-4-e2b-it-cq4" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend metal \
            --n 5 \
            --max-tokens 1024 \
            --tag good-cq4-old-engine-metal-n5 \
            | tee good_metal_n5.txt

      # ============================================================
      # 6. Delete GOOD to free disk
      # ============================================================

      - name: Remove GOOD CQ4
        run: |
          rm -rf "$RUNNER_TEMP/good_cq4"
          rm -f "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip"

          echo "===== DISK AFTER GOOD ====="
          df -h

      # ============================================================
      # 7. BAD calibrated CQ4
      # ============================================================

      - name: Download BAD calibrated CQ4
        shell: bash
        run: |
          source venv/bin/activate

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify BAD hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7a2579ad1089f626b15e121a1fa6a0d8294a4e7f1f7af38823620b5b5a8b8eec  gemma-4-e2b-it-cq4.zip" \
          | shasum -a 256 -c -

      - name: Extract BAD CQ4
        run: |
          mkdir -p "$RUNNER_TEMP/bad_cq4"

          unzip -q \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip" \
            -d "$RUNNER_TEMP/bad_cq4"

          echo "===== BAD BUNDLE ====="
          find "$RUNNER_TEMP/bad_cq4" -name config.txt

          echo
          df -h

      - name: Run BAD GSM8K n=5 on Metal
        shell: bash
        run: |
          source venv/bin/activate

          GSM8K_REPORTS="$RUNNER_TEMP/gsm8k_reports" \
          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/bad_cq4/gemma-4-e2b-it-cq4-calibrated" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend metal \
            --n 5 \
            --max-tokens 1024 \
            --tag bad-cq4-old-engine-metal-n5 \
            | tee bad_metal_n5.txt

      # ============================================================
      # 8. Print comparison
      # ============================================================

      - name: Print Metal n5 comparison
        run: |
          echo
          echo "=========================================="
          echo "GOOD CQ4 — ENGINE 1ace6d78 — METAL — n=5"
          echo "=========================================="
          cat good_metal_n5.txt

          echo
          echo "=========================================="
          echo "BAD CQ4 — ENGINE 1ace6d78 — METAL — n=5"
          echo "=========================================="
          cat bad_metal_n5.txt

          echo
          echo "=========================================="
          echo "RESULT JSON"
          echo "=========================================="

          cat "$RUNNER_TEMP/gsm8k_reports/gsm8k_good-cq4-old-engine-metal-n5.json"

          echo

          cat "$RUNNER_TEMP/gsm8k_reports/gsm8k_bad-cq4-old-engine-metal-n5.json"

      # ============================================================
      # 9. Upload results
      # ============================================================

      - name: Collect results
        run: |
          mkdir -p issue773_results

          cp good_metal_n5.txt issue773_results/
          cp bad_metal_n5.txt issue773_results/

          cp "$RUNNER_TEMP/gsm8k_reports/"*.json issue773_results/

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: issue773-metal-n5-results
          path: issue773_results/
