name: Issue 773 Old Engine GSM8K Repro

on:
  workflow_dispatch:
  push:
    branches:
      - issue773-repro

jobs:
  old-engine-gsm8k:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. Checkout repo, then move runtime to reporter's engine SHA
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout reporter Cactus engine commit
        run: |
          git fetch https://github.com/cactus-compute/cactus.git \
            1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          git checkout 1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          echo "===== CACTUS ENGINE COMMIT ====="
          git rev-parse HEAD
          git log -1 --oneline

      - name: Show machine info
        run: |
          echo "===== MACHINE ====="
          uname -a
          uname -m
          lscpu

      # ============================================================
      # 2. Build OLD Cactus engine natively on ARM64
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            python3 \
            python3-venv \
            python3-pip \
            unzip \
            git

      - name: Setup old Cactus and build Python runtime
        shell: bash
        run: |
          source ./setup
          cactus build --python

          echo
          echo "===== RUNTIME LIBRARY ====="
          file cactus-engine/build/libcactus_engine.so
          ls -lh cactus-engine/build/libcactus_engine.so

      # ============================================================
      # 3. Tools
      # ============================================================

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          source venv/bin/activate
          python -m pip install -U huggingface_hub

      # ============================================================
      # 4. Reporter GSM8K harness
      # ============================================================

      - name: Fetch pinned GSM8K harness
        run: |
          git clone \
            https://github.com/john-rocky/apple-silicon-llm-bench.git \
            "$RUNNER_TEMP/llm-bench"

          cd "$RUNNER_TEMP/llm-bench"

          git checkout fab4074629bd87116c405e5073f91bc3524b5eff

          echo "===== HARNESS COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== PINNED GSM8K ====="
          ls -lh evaldata/gsm8k_test.jsonl
          ls -lh scripts/parity_gsm8k.py

      # ============================================================
      # 5. BAD calibrated CQ4
      # ============================================================

      - name: Download BAD calibrated CQ4
        shell: bash
        run: |
          source venv/bin/activate

          mkdir -p "$RUNNER_TEMP/issue773"

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify BAD hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7a2579ad1089f626b15e121a1fa6a0d8294a4e7f1f7af38823620b5b5a8b8eec  gemma-4-e2b-it-cq4.zip" \
          | sha256sum -c -

      - name: Extract BAD CQ4
        run: |
          mkdir -p "$RUNNER_TEMP/bad_cq4"

          unzip -q \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip" \
            -d "$RUNNER_TEMP/bad_cq4"

          find "$RUNNER_TEMP/bad_cq4" -name config.txt

      - name: Run BAD GSM8K n=10
        shell: bash
        run: |
          source venv/bin/activate

          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/bad_cq4/gemma-4-e2b-it-cq4-calibrated" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend cpu \
            --n 10 \
            --max-tokens 1024 \
            --tag bad-cq4-old-engine-cpu \
            | tee bad_old_engine.txt

      # ============================================================
      # 6. Remove BAD to save disk
      # ============================================================

      - name: Remove BAD CQ4
        run: |
          rm -rf "$RUNNER_TEMP/bad_cq4"
          rm -f "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip"

          df -h

      # ============================================================
      # 7. GOOD uncalibrated CQ4
      # ============================================================

      - name: Download GOOD uncalibrated CQ4
        shell: bash
        run: |
          source venv/bin/activate

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4-uncalibrated.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify GOOD hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7c71f075554bd27bd443f75ff2012b95be30f0254f7d864642ee89d3b706d980  gemma-4-e2b-it-cq4-uncalibrated.zip" \
          | sha256sum -c -

      - name: Extract GOOD CQ4
        run: |
          mkdir -p "$RUNNER_TEMP/good_cq4"

          unzip -q \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip" \
            -d "$RUNNER_TEMP/good_cq4"

          find "$RUNNER_TEMP/good_cq4" -name config.txt

      - name: Run GOOD GSM8K n=10
        shell: bash
        run: |
          source venv/bin/activate

          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/good_cq4/gemma-4-e2b-it-cq4" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend cpu \
            --n 10 \
            --max-tokens 1024 \
            --tag good-cq4-old-engine-cpu \
            | tee good_old_engine.txt

      # ============================================================
      # 8. Compare
      # ============================================================

      - name: Print old-engine comparison
        run: |
          echo
          echo "=========================================="
          echo "BAD CQ4 — ENGINE 1ace6d78 — CPU"
          echo "=========================================="
          cat bad_old_engine.txt

          echo
          echo "=========================================="
          echo "GOOD CQ4 — ENGINE 1ace6d78 — CPU"
          echo "=========================================="
          cat good_old_engine.txt

      # ============================================================
      # 9. Save result logs
      # ============================================================

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: issue773-old-engine-cpu-n10
          path: |
            bad_old_engine.txt
            good_old_engine.txt
