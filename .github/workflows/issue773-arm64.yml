name: Issue 773 GSM8K ARM64 Repro

on:
  workflow_dispatch:
  push:
    branches:
      - issue773-repro

jobs:
  gsm8k-repro:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. Checkout current Cactus engine
      # ============================================================

      - name: Checkout Cactus
        uses: actions/checkout@v4

      - name: Show machine and Cactus version
        run: |
          echo "===== MACHINE ====="
          uname -a
          uname -m
          lscpu

          echo
          echo "===== CACTUS COMMIT ====="
          git rev-parse HEAD
          git log -1 --oneline

      # ============================================================
      # 2. Build Cactus natively on ARM64
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            python3 \
            python3-venv \
            python3-pip \
            unzip \
            git

      - name: Setup Cactus and build Python runtime
        shell: bash
        run: |
          source ./setup
          cactus build --python

          echo
          echo "===== RUNTIME LIBRARY ====="
          file cactus-engine/build/libcactus_engine.so
          ls -lh cactus-engine/build/libcactus_engine.so

      # ============================================================
      # 3. Install download tooling
      # ============================================================

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          source venv/bin/activate
          python -m pip install -U huggingface_hub

      # ============================================================
      # 4. Fetch reporter's canonical GSM8K harness
      # ============================================================

      - name: Fetch pinned GSM8K harness
        run: |
          git clone \
            https://github.com/john-rocky/apple-silicon-llm-bench.git \
            "$RUNNER_TEMP/llm-bench"

          cd "$RUNNER_TEMP/llm-bench"

          # July 20 canonical harness + scoring fixes
          git checkout fab4074629bd87116c405e5073f91bc3524b5eff

          echo
          echo "===== HARNESS COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== GSM8K FILE ====="
          ls -lh evaldata/gsm8k_test.jsonl

          echo
          echo "===== HARNESS ====="
          ls -lh scripts/parity_gsm8k.py

      # ============================================================
      # 5. BAD CQ4 — calibrated artifact
      # ============================================================

      - name: Download BAD calibrated CQ4
        shell: bash
        run: |
          source venv/bin/activate

          mkdir -p "$RUNNER_TEMP/issue773"

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify BAD artifact hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7a2579ad1089f626b15e121a1fa6a0d8294a4e7f1f7af38823620b5b5a8b8eec  gemma-4-e2b-it-cq4.zip" \
          | sha256sum -c -

      - name: Extract BAD CQ4
        run: |
          mkdir -p "$RUNNER_TEMP/bad_cq4"

          unzip -q \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip" \
            -d "$RUNNER_TEMP/bad_cq4"

          echo "===== BAD CONFIG ====="
          find "$RUNNER_TEMP/bad_cq4" -name config.txt

      - name: Run BAD GSM8K n=10
        shell: bash
        run: |
          source venv/bin/activate

          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/bad_cq4/gemma-4-e2b-it-cq4-calibrated" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend cpu \
            --n 10 \
            --max-tokens 1024 \
            --tag bad-cq4-current-engine-cpu \
            | tee bad_gsm8k.txt

      # ============================================================
      # 6. Free disk before GOOD model
      # ============================================================

      - name: Remove BAD CQ4
        run: |
          rm -rf "$RUNNER_TEMP/bad_cq4"
          rm -f "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4.zip"

          echo "===== DISK AFTER BAD ====="
          df -h

      # ============================================================
      # 7. GOOD CQ4 — previous uncalibrated artifact
      # ============================================================

      - name: Download GOOD uncalibrated CQ4
        shell: bash
        run: |
          source venv/bin/activate

          hf download Cactus-Compute/gemma-4-E2B-it \
            gemma-4-e2b-it-cq4-uncalibrated.zip \
            --local-dir "$RUNNER_TEMP/issue773"

      - name: Verify GOOD artifact hash
        run: |
          cd "$RUNNER_TEMP/issue773"

          echo \
          "7c71f075554bd27bd443f75ff2012b95be30f0254f7d864642ee89d3b706d980  gemma-4-e2b-it-cq4-uncalibrated.zip" \
          | sha256sum -c -

      - name: Extract GOOD CQ4
        run: |
          mkdir -p "$RUNNER_TEMP/good_cq4"

          unzip -q \
            "$RUNNER_TEMP/issue773/gemma-4-e2b-it-cq4-uncalibrated.zip" \
            -d "$RUNNER_TEMP/good_cq4"

          echo "===== GOOD CONFIG ====="
          find "$RUNNER_TEMP/good_cq4" -name config.txt

      - name: Run GOOD GSM8K n=10
        shell: bash
        run: |
          source venv/bin/activate

          python "$RUNNER_TEMP/llm-bench/scripts/parity_gsm8k.py" \
            --which cactus \
            --bundle "$RUNNER_TEMP/good_cq4/gemma-4-e2b-it-cq4" \
            --cactus-repo "$GITHUB_WORKSPACE" \
            --cactus-backend cpu \
            --n 10 \
            --max-tokens 1024 \
            --tag good-cq4-current-engine-cpu \
            | tee good_gsm8k.txt

      # ============================================================
      # 8. Print A/B result
      # ============================================================

      - name: Print GSM8K comparison
        run: |
          echo
          echo "=========================================="
          echo "BAD CALIBRATED CQ4"
          echo "=========================================="
          cat bad_gsm8k.txt

          echo
          echo "=========================================="
          echo "GOOD UNCALIBRATED CQ4"
          echo "=========================================="
          cat good_gsm8k.txt

      # ============================================================
      # 9. Save logs
      # ============================================================

      - name: Upload GSM8K results
        uses: actions/upload-artifact@v4
        with:
          name: issue773-gsm8k-n10-results
          path: |
            bad_gsm8k.txt
            good_gsm8k.txt
