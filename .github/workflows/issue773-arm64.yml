name: Issue 773 Metal Availability Probe

on:
  workflow_dispatch:
  push:
    branches:
      - issue773-repro

jobs:
  metal-probe:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      # ============================================================
      # 1. Checkout reporter's Cactus version
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout reporter engine commit
        run: |
          git fetch https://github.com/cactus-compute/cactus.git \
            1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          git checkout 1ace6d78767ab84e4ea3feb0d4d99a36ab884a3b

          echo "===== CACTUS COMMIT ====="
          git rev-parse HEAD
          git log -1 --oneline

      # ============================================================
      # 2. Inspect Apple runner
      # ============================================================

      - name: Show machine info
        run: |
          echo "===== ARCH ====="
          uname -a
          uname -m
          arch

          echo
          echo "===== MACOS ====="
          sw_vers

          echo
          echo "===== HARDWARE ====="
          system_profiler SPHardwareDataType

          echo
          echo "===== DISPLAY / GPU ====="
          system_profiler SPDisplaysDataType || true

      # ============================================================
      # 3. Check whether macOS runner exposes a real Metal device
      # ============================================================

      - name: Probe Metal device
        run: |
          cat > /tmp/metal_probe.swift <<'SWIFT'
          import Foundation
          import Metal

          if let device = MTLCreateSystemDefaultDevice() {
              print("METAL_AVAILABLE=YES")
              print("METAL_DEVICE=\(device.name)")
              print("LOW_POWER=\(device.isLowPower)")
              print("REMOVABLE=\(device.isRemovable)")
          } else {
              print("METAL_AVAILABLE=NO")
              exit(1)
          }
          SWIFT

          swift /tmp/metal_probe.swift

      # ============================================================
      # 4. Build old Cactus runtime on macOS ARM64
      # ============================================================

      - name: Install dependencies
        run: |
          brew install python@3.12 cmake

      - name: Build Cactus
        shell: bash
        run: |
          source ./setup
          cactus build --python

          echo
          echo "===== CACTUS LIBRARY ====="
          file cactus-engine/build/libcactus_engine.dylib
          ls -lh cactus-engine/build/libcactus_engine.dylib

      # ============================================================
      # 5. Check Cactus itself accepts Metal backend
      # ============================================================

      - name: Probe Cactus Metal backend
        shell: bash
        run: |
          source venv/bin/activate

          python - <<'PY'
          from cactus.bindings import cactus as C

          rc = C.cactus_set_backend("metal")

          print("cactus_set_backend('metal') =", rc)

          if rc != 0:
              raise SystemExit("Cactus rejected Metal backend")

          print("CACTUS_METAL_BACKEND=AVAILABLE")
          PY
